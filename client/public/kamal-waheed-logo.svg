<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6A24A"/>
      <stop offset="50%" stop-color="#A86D1F"/>
      <stop offset="100%" stop-color="#6F4318"/>
    </linearGradient>
    <linearGradient id="roofGold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D6A24A"/>
      <stop offset="100%" stop-color="#A86D1F"/>
    </linearGradient>
    <linearGradient id="arabicGold" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="35%" stop-color="#C9A033"/>
      <stop offset="65%" stop-color="#A86D1F"/>
      <stop offset="100%" stop-color="#6F4318"/>
    </linearGradient>
    <linearGradient id="swooshGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A033"/>
      <stop offset="50%" stop-color="#A86D1F"/>
      <stop offset="100%" stop-color="#D6A24A"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A86D1F"/>
      <stop offset="100%" stop-color="#6F4318"/>
    </linearGradient>
    <filter id="logoShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F1C15" flood-opacity="0.18"/>
    </filter>
    <filter id="goldGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A86D1F" flood-opacity="0.25"/>
    </filter>
    <clipPath id="logoClip">
      <circle cx="300" cy="340" r="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="780" fill="#FEFEFE"/>

  <!-- Decorative circular frame (subtle) -->
  <circle cx="300" cy="340" r="280" fill="none" stroke="#D9CEC4" stroke-width="0.5" opacity="0.4"/>

  <!-- ====== ROOF / HOUSE ICON ====== -->
  <!-- Roof outline (gold gradient) -->
  <path d="M 155 155 L 300 60 L 445 155" fill="none" stroke="url(#roofGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof fill (subtle warm white) -->
  <path d="M 155 155 L 300 60 L 445 155 Z" fill="#FEFEFE" fill-opacity="0.6"/>

  <!-- Chimney (black) -->
  <rect x="375" y="55" width="14" height="35" rx="2" fill="#1F1C15"/>
  <rect x="371" y="48" width="22" height="10" rx="3" fill="#1F1C15"/>

  <!-- Window panes (2x2 gold squares) -->
  <g transform="translate(280, 88)">
    <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="18" y="0" width="14" height="14" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="0" y="18" width="14" height="14" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="18" y="18" width="14" height="14" rx="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- ====== DECORATIVE CURVED FRAME (left side) ====== -->
  <!-- Main curved stroke (black) -->
  <path d="M 120 420 C 60 350 80 220 200 160" stroke="#1F1C15" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Gold accent inner curve -->
  <path d="M 130 410 C 75 345 90 230 205 168" stroke="url(#swooshGold)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Right decorative swoosh (gold) -->
  <path d="M 420 400 C 480 340 470 250 400 200" stroke="url(#swooshGold)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ====== ARABIC WORDMARK: كمال وحيد ====== -->
  <!-- "وحيد" (Waheed) - gold gradient, left side -->
  <text x="245" y="310" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="110" font-weight="700" fill="url(#arabicGold)" text-anchor="middle" filter="url(#logoShadow)" direction="rtl">وحيد</text>

  <!-- "كمال" (Kamal) - charcoal, right side -->
  <text x="385" y="290" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="115" font-weight="700" fill="#1F1C15" text-anchor="middle" filter="url(#logoShadow)" direction="rtl">كمال</text>

  <!-- ====== ENGLISH SIGNATURE: Kamal Waheed ====== -->
  <text x="300" y="385" font-family="'Amiri', Georgia, serif" font-size="44" font-style="italic" fill="#1F1C15" text-anchor="middle" letter-spacing="1">Kamal Waheed</text>

  <!-- Gold underline swoosh under English text -->
  <path d="M 170 400 Q 300 420 430 398" stroke="url(#swooshGold)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ====== CATEGORY ICONS ROW ====== -->
  <!-- Icons: pot, fork+knife, plate, vase, lamp -->
  <g transform="translate(155, 440)" filter="url(#goldGlow)">
    <!-- Pot / Cooking -->
    <g transform="translate(0, 0)">
      <rect x="6" y="10" width="26" height="16" rx="3" fill="none" stroke="url(#iconGold)" stroke-width="2.5"/>
      <path d="M 4 10 Q 4 4 19 4 Q 34 4 34 10" fill="none" stroke="url(#iconGold)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="19" y1="1" x2="19" y2="4" stroke="url(#iconGold)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="19" cy="1" r="2" fill="url(#iconGold)"/>
    </g>

    <!-- Fork + Knife (Dining) -->
    <g transform="translate(72, 0)">
      <!-- Knife -->
      <path d="M 12 3 L 12 26" stroke="url(#iconGold)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 12 3 Q 18 3 18 10 L 12 10" fill="none" stroke="url(#iconGold)" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Fork -->
      <path d="M 26 3 L 26 10 L 23 10 M 26 10 L 29 10" stroke="url(#iconGold)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 23 3 L 23 10 M 26 3 L 26 10 M 29 3 L 29 10" stroke="url(#iconGold)" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="10" x2="26" y2="26" stroke="url(#iconGold)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Plate / Dish -->
    <g transform="translate(142, 0)">
      <circle cx="18" cy="14" r="13" fill="none" stroke="url(#iconGold)" stroke-width="2.5"/>
      <circle cx="18" cy="14" r="7" fill="none" stroke="url(#iconGold)" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Vase with leaves (Home Décor) -->
    <g transform="translate(215, 0)">
      <path d="M 14 28 L 14 18 Q 14 14 18 14 Q 22 14 22 18 L 22 28 Z" fill="none" stroke="url(#iconGold)" stroke-width="2.5"/>
      <path d="M 18 14 Q 18 6 12 3" fill="none" stroke="url(#iconGold)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 14 Q 18 8 24 5" fill="none" stroke="url(#iconGold)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 18 16 Q 16 10 14 7" fill="none" stroke="url(#iconGold)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="3" r="2" fill="url(#iconGold)" opacity="0.7"/>
      <circle cx="24" cy="5" r="2" fill="url(#iconGold)" opacity="0.7"/>
    </g>

    <!-- Lamp (Lighting) -->
    <g transform="translate(288, 0)">
      <path d="M 10 14 L 26 14" stroke="url(#iconGold)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 10 14 L 6 3 Q 18 -2 30 3 L 26 14" fill="none" stroke="url(#iconGold)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="18" y1="14" x2="18" y2="26" stroke="url(#iconGold)" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="18" cy="27" rx="8" ry="2" fill="none" stroke="url(#iconGold)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ====== GOLD DIVIDER LINES ====== -->
  <!-- Left divider -->
  <line x1="100" y1="510" x2="250" y2="510" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="100" cy="510" r="3" fill="url(#goldGrad)"/>
  <circle cx="250" cy="510" r="2" fill="url(#goldGrad)"/>

  <!-- Right divider -->
  <line x1="350" y1="510" x2="500" y2="510" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="350" cy="510" r="2" fill="url(#goldGrad)"/>
  <circle cx="500" cy="510" r="3" fill="url(#goldGrad)"/>

  <!-- Center dot -->
  <circle cx="300" cy="510" r="4" fill="url(#goldGrad)"/>

  <!-- ====== TAGLINE: ادوات منزلية وديكور ====== -->
  <text x="300" y="555" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="28" font-weight="700" fill="#1F1C15" text-anchor="middle" direction="rtl">ادوات منزلية وديكور</text>

  <!-- ====== BOTTOM DECORATIVE ORNAMENT ====== -->
  <g transform="translate(265, 580)" fill="url(#goldGrad)">
    <!-- Fleur-de-lis style ornament -->
    <path d="M 35 20 C 35 12 28 8 25 2 C 22 8 15 12 15 20 C 15 26 20 30 25 34 C 30 30 35 26 35 20Z" opacity="0.8"/>
    <circle cx="25" cy="15" r="2" fill="#FEFEFE"/>
    <!-- Side petals -->
    <path d="M 10 18 C 6 14 6 8 10 6 C 12 10 12 14 10 18Z" opacity="0.5"/>
    <path d="M 40 18 C 44 14 44 8 40 6 C 38 10 38 14 40 18Z" opacity="0.5"/>
  </g>

  <!-- ====== SUBTLE GOLD ACCENT RING ====== -->
  <circle cx="300" cy="340" r="280" fill="none" stroke="url(#swooshGold)" stroke-width="0.8" opacity="0.15" stroke-dasharray="8 12"/>
</svg>
