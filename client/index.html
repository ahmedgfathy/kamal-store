<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurum &amp; Co. | Home &amp; Kitchen Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "var(--primary)",
            secondary: "var(--secondary)",
            accent: "var(--accent)",
            cream: "var(--cream)",
            warm: "var(--warm)",
            sage: "var(--sage)",
            brown: "var(--brown)",
            sand: "var(--sand)",
            stone: "var(--stone)",
            gold: "var(--gold)",
            success: "var(--success)",
            sale: "var(--sale)",
            line: "var(--border)",
            oldcream: "#FFF7EE",
            oldbeige: "#E8D8C9",
            oldbrown: "#7E6456",
            oldnavy: "#20323E",
            oldblue: "#6A93A8",
            oldlightblue: "#B0C8D6",
            oldsand: "#CDBCA6",
            oldlightcream: "#F2EADB",
          },
          fontFamily: {
            cairo: ["var(--font-heading)", "sans-serif"],
            roboto: ["var(--font-body)", "sans-serif"],
            poppins: ["Poppins", "sans-serif"],
            inter: ["Inter", "sans-serif"],
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --primary: #274B3C;
      --secondary: #E6864A;
      --accent: #BC391B;
      --cream: #FAF9F6;
      --warm: #F8EBDF;
      --sage: #A1A394;
      --brown: #6B4937;
      --sand: #CFB8AB;
      --stone: #978B84;
      --gold: #C9A86A;
      --success: #4F7A52;
      --sale: #D3542F;
      --border: #E9E0DE;
      --font-heading: "Poppins", "Cairo", sans-serif;
      --font-body: "Inter", "Cairo", sans-serif;
    }
    body.old-theme {
      --primary: #20323E;
      --secondary: #6A93A8;
      --accent: #7E6456;
      --cream: #FFF7EE;
      --warm: #F2EADB;
      --sage: #B0C8D6;
      --brown: #7E6456;
      --sand: #CDBCA6;
      --stone: #978B84;
      --gold: #C9A86A;
      --success: #4F7A52;
      --sale: #D3542F;
      --border: #E8D8C9;
      --font-heading: "Cairo", sans-serif;
      --font-body: "Roboto", "Cairo", sans-serif;
    }
    .hero-bg { background: linear-gradient(135deg, #FAF9F6 0%, #F8EBDF 50%, #CFB8AB 100%); }
    .hero-img { background: url("https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=900&q=80") center/cover no-repeat; }
    .cat-card:hover img { transform: scale(1.08); }
    .product-img:hover { transform: scale(1.05); }
    .marquee { animation: marquee 25s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  </style>
</head>
<body class="bg-cream font-inter text-brown">
  <div id="root"></div>
  <button id="theme-toggle" class="fixed bottom-5 right-5 rtl:right-auto rtl:left-5 z-50 w-11 h-11 rounded-full bg-primary text-white shadow-lg flex items-center justify-center hover:bg-accent transition" title="Toggle theme"></button>
  <script>
    (function () {
      if (localStorage.getItem("aurum-theme") === "old") document.body.classList.add("old-theme");
      var btn = document.getElementById("theme-toggle");
      function render() {
        var old = document.body.classList.contains("old-theme");
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">' + (old ? "nightlight" : "brightness_7") + "</span>";
        btn.title = old ? "Switch to Zara Home theme" : "Switch to original theme";
      }
      btn.addEventListener("click", function () {
        document.body.classList.toggle("old-theme");
        localStorage.setItem("aurum-theme", document.body.classList.contains("old-theme") ? "old" : "new");
        render();
      });
      render();
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
