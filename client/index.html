<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كمال وحيد | Kamal Waheed — Home &amp; Décor</title>
  <meta name="description" content="كمال وحيد — جودة تختارها، وأناقة تعيشها. منتجات منزلية ومطبخية فاخرة." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.gstatic.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0fdisplay=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1F1C15;
      --secondary: #A86D1F;
      --accent: #463623;
      --cream: #FEFEFE;
      --warm: #F3F0EB;
      --sage: #D9CEC4;
      --brown: #1F1C15;
      --sand: #C8BCB1;
      --stone: #8E806F;
      --gold: #A86D1F;
      --success: #4F7A52;
      --sale: #B0562F;
      --border: #D9CEC4;
      --font-heading: "Cairo", "Roboto", sans-serif;
      --font-body: "Cairo", "Roboto", sans-serif;
      --font-logo-ar: "Amiri", "Cairo", serif;
    }
    .hero-bg { background: linear-gradient(135deg, #FEFEFE 0%, #F3F0EB 50%, #D9CEC4 100%); }
    .hero-img { background: url("https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=900&q=80") center/cover no-repeat; }
    .cat-card:hover img { transform: scale(1.08); }
    .product-img:hover { transform: scale(1.05); }
    .marquee { animation: marquee 25s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .card-shadow { box-shadow: 0 12px 30px rgba(31, 28, 21, 0.14); }
    .card-shadow-soft { box-shadow: 0 4px 16px rgba(31, 28, 21, 0.08); }
    .gold-divider { height: 1px; background: #A86D1F; }
  </style>
</head>
<body class="bg-cream font-cairo text-brown">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
